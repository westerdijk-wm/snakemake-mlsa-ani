$schema: "http://json-schema.org/draft-07/schema#"

type: object

properties:
  accessions:
    type: string
    description: >
      Path to a TSV file (columns: sample, assembly) listing public genomes
      to download from NCBI. The key may be omitted or commented out entirely
      to run with local genomes only.

  extraction_method:
    type: string
    enum:
      - mapping
      - amplicon
    default: mapping
    description: Method for extracting target genes [mapping, amplicon]
  
  filtering:
    type: object
    description: parameters for filtering result regions
    properties:
      minimum_similarity:
        type: number
        description: minimum similarity of the region to keep (0-1)
      min_amplicon_length:
        type: integer
        description: minimum length of amplicon to keep
      max_amplicon_length:
        type: integer
        description: maximum length of amplicon to keep
      max_total_mismatches:
        type: integer
        description: maximum number of total mismatches allowed for the oligos combined
      reject_primer_from:
        type: integer
        description: minimum number mismatches per oligo that will reject the amplicon
    if:
      properties:
        extraction_method:
          const: amplicon
    then:
      required:
        - min_amplicon_length
        - max_amplicon_length
        - max_total_mismatches
        - reject_primer_from
    if:
      properties:
        extraction_method:
          const: mapping
    then:
      required:
        - minimum_similarity

  ani_method:
    type: string
    enum:
      - none
      - fastani
      - pyani
      - skani
    default: skani

  genes:
    type: array
    minItems: 1
    items:
      type: string

  ref_genes:
    type: string
    description: Path to the reference gene FASTA file.

  tree:
    type: object

    properties:
      method:
        type: string
        enum:
          - raxml
          - iqtree
          - fasttree
        default: iqtree

      bootstrap:
        type: integer
        minimum: 1
        default: 1000

    required:
      - method

    allOf:
      # RAxML
      - if:
          properties:
            method:
              const: raxml
        then:
          required:
            - bootstrap
          properties:
            bootstrap:
              type: integer
              minimum: 1

      # IQ-TREE
      - if:
          properties:
            method:
              const: iqtree
        then:
          required:
            - bootstrap
          properties:
            bootstrap:
              type: integer
              minimum: 100

      # FastTree
      - if:
          properties:
            method:
              const: fasttree
        then:
          not:
            required:
              - bootstrap

required:
  - genes
  - extraction_method
  - ani_method
  - tree
  - filtering

if:
  properties:
    extraction_method:
      const: mapping
then:
  required:
    - ref_genes
if:
  properties:
    extraction_method:
      const: amplicon
then:
  required:
    - primers
